<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DevHawx Retail POS — a lightweight, offline-first point of sale demo built with vanilla HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#0B192C">
  <title>Dashboard · DevHawx POS</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The web font loads without blocking the first paint; the system stack is used until it arrives. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#app-content">Skip to main content</a>

  <div class="app-shell">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="sidebar-brand">
        <img class="brand-mark" src="assets/icons/logo-mark.svg" alt="" width="42" height="42">
        <div class="brand-text">
          <strong>DevHawx</strong>
          <span>Retail POS</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebar-close" type="button" aria-label="Close navigation">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav" id="app-nav"></nav>

      <div class="sidebar-footer">
        <div class="demo-card">
          <span class="demo-dot" aria-hidden="true"></span>
          <div>
            <strong>Demo workspace</strong>
            <span>Data saved on this device</span>
          </div>
        </div>
        <div class="sidebar-user">
          <span class="avatar" aria-hidden="true">AD</span>
          <div class="sidebar-user-info">
            <strong>Admin</strong>
            <span>Store manager</span>
          </div>
          <button class="icon-btn" id="sidebar-user-menu" type="button" aria-label="Open account settings">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

    <!-- ============ Main application ============ -->
    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="page-head">
          <p class="page-kicker" id="page-kicker">Overview</p>
          <h1 id="page-title">Dashboard</h1>
        </div>

        <div class="topbar-actions">
          <div class="search-wrap" id="search-wrap">
            <label class="search-box" for="global-search">
              <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="global-search" type="search" placeholder="Search products, customers, sales…" autocomplete="off" aria-label="Search the workspace">
              <kbd class="kbd" aria-hidden="true">/</kbd>
            </label>
            <button class="icon-btn search-close" id="search-close" type="button" aria-label="Close search">
              <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div class="search-results" id="search-results" role="region" aria-label="Search results" hidden></div>
          </div>

          <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Open search" aria-expanded="false" aria-controls="search-wrap">
            <svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>

          <span class="topbar-date" id="topbar-date"></span>

          <div class="popover-wrap">
            <button class="icon-btn has-dot" id="notifications-btn" type="button" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false" aria-controls="notifications-panel">
              <svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            </button>
            <div class="popover" id="notifications-panel" role="dialog" aria-label="Notifications" hidden></div>
          </div>

          <button class="btn btn-primary btn-new-sale" id="new-sale-btn" type="button">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>New sale</span>
          </button>

          <div class="popover-wrap">
            <button class="topbar-user" id="topbar-user" type="button" aria-label="Open account menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="profile-panel">
              <span class="avatar" aria-hidden="true">AD</span>
              <span class="sr-only">Account menu</span>
            </button>
            <div class="popover profile-popover" id="profile-panel" role="dialog" aria-label="Account menu" hidden></div>
          </div>
        </div>
      </header>

      <main class="content" id="app-content" tabindex="-1">
        <div class="view-root" id="view-root"></div>
      </main>

      <footer class="app-footer">
        <span>© <span id="year">2026</span> DevHawx POS · Demo build</span>
        <span class="footer-meta">
          <span class="footer-dot" aria-hidden="true"></span>
          Local-first · <span id="storage-status">localStorage</span>
        </span>
      </footer>
    </div>
  </div>

  <div class="toast-root" id="toast-root" role="status" aria-live="polite" aria-atomic="false"></div>
  <div class="modal-root" id="modal-root"></div>

  <!-- ============ Scripts (load order matters for the namespace) ============ -->
  <script src="js/storage.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/receipt.js" defer></script>
  <script src="js/products.js" defer></script>
  <script src="js/inventory.js" defer></script>
  <script src="js/pos.js" defer></script>
  <script src="js/customers.js" defer></script>
  <script src="js/sales.js" defer></script>
  <script src="js/reports.js" defer></script>
  <script src="js/settings.js" defer></script>
</body>
</html>
